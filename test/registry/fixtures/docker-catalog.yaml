  aks:
    description: Azure Kubernetes Service (AKS) official MCP server.
    title: Azure Kubernetes Service (AKS)
    type: server
    dateAdded: 2025-08-20T06:26:55Z
    image: mcp/aks@sha256:6a0948a385b3a85d9d07db61edf59d1d398b4d6ada67e6bd649f6c383a493307
    ref: ""
    source: https://github.com/Azure/aks-mcp/tree/e60444c3d739dc3606d9ff4cd3826019e02df8d9
    upstream: https://github.com/Azure/aks-mcp
    icon: https://raw.githubusercontent.com/Azure/AKS/1c3979cf6729c78cfff2c0c78cb0aa657e1bbf7a/blog/assets/images/400x400.png
    command:
      - --transport=stdio
      - --access-level={{aks.access_level}}
      - --allow-namespaces={{aks.allow_namespaces}}
      - --additional-tools={{aks.additional_tools}}
    volumes:
      - "{{aks.azure_dir}}:/home/mcp/.azure"
      - "{{aks.kubeconfig}}:/home/mcp/.kube/config"
    user: "{{aks.container_user}}"
    config:
      - name: aks
        description: Configuration for AKS-MCP server
        type: object
        properties:
          azure_dir:
            type: string
            description: Path to the Azure configuration directory (e.g.
              /home/azureuser/.azure). Used for Azure CLI authentication, you
              should be logged in (e.g. run `az login`) on the host before
              starting the MCP server.
          kubeconfig:
            type: string
            description: Path to the kubeconfig file for the AKS cluster (e.g.
              /home/azureuser/.kube/config). Used to connect to the AKS cluster.
          access_level:
            type: string
            description: Access level for the MCP server, One of [ readonly, readwrite,
              admin ]
          allow_namespaces:
            type: string
            description: Comma-separated list of namespaces to allow access to. If not
              specified, all namespaces are allowed.
          additional_tools:
            type: string
            description: Comma-separated list of additional tools, One of [ helm, cilium ]
          container_user:
            type: string
            description: Username or UID of the container user (format
              <name|uid>[:<group|gid>] e.g. 10000), ensuring correct permissions
              to access the Azure and kubeconfig files. Leave empty to use
              default user in the container.
        required:
          - azure_dir
          - kubeconfig
          - access_level
    metadata:
      pulls: 19107
      stars: 2
      githubStars: 143
      category: devops
      tags:
        - devops
        - azure
        - kubernetes
        - aks
      license: MIT License
      owner: Azure
