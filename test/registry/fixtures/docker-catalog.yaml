  atlassian:
    description: Tools for Atlassian products (Confluence and Jira). This
      integration supports both Atlassian Cloud and Jira Server/Data Center
      deployments.
    title: Atlassian
    type: server
    dateAdded: 2025-05-05T20:08:35Z
    image: mcp/atlassian@sha256:ecec36c622798897c4ede7a43b15069dac048d5be13af07aa3320450fe65f953
    ref: ""
    source: https://github.com/sooperset/mcp-atlassian/tree/35b1da00c920810e7d4119cdd9fcc5b46eec5b0e
    upstream: https://github.com/sooperset/mcp-atlassian
    icon: https://avatars.githubusercontent.com/u/43281909?s=200&v=4
    secrets:
      - name: atlassian.confluence.api_token
        env: CONFLUENCE_API_TOKEN
        example: your_api_token
      - name: atlassian.confluence.personal_token
        env: CONFLUENCE_PERSONAL_TOKEN
        example: your_api_token
      - name: atlassian.jira.api_token
        env: JIRA_API_TOKEN
        example: your_api_token
      - name: atlassian.jira.personal_token
        env: JIRA_PERSONAL_TOKEN
        example: your_api_token
    env:
      - name: CONFLUENCE_URL
        value: "{{atlassian.confluence.url}}"
      - name: CONFLUENCE_USERNAME
        value: "{{atlassian.confluence.username}}"
      - name: JIRA_URL
        value: "{{atlassian.jira.url}}"
      - name: JIRA_USERNAME
        value: "{{atlassian.jira.username}}"
    config:
      - name: atlassian
        description: The MCP server is allowed to access these paths
        type: object
        properties:
          confluence:
            type: object
            properties:
              url:
                type: string
              username:
                type: string
            required:
              - url
          jira:
            type: object
            properties:
              url:
                type: string
              username:
                type: string
            required:
              - url
        anyOf:
          - required:
              - confluence
          - required:
              - jira
    metadata:
      pulls: 169249
      stars: 22
      githubStars: 6029
      category: productivity
      tags:
        - atlassian
        - confluence
        - jira
      license: MIT License
      owner: sooperset
